name: CI

on:
  push:
    branches:
      - development
      - master
      - 'milestone/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats jq shellcheck

      - name: Install pinned shfmt
        env:
          SHFMT_VERSION: v3.14.1
          SHFMT_SHA256: 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          printf '%s  %s\n' "${SHFMT_SHA256}" /tmp/shfmt | sha256sum --check -
          sudo install --mode=0755 /tmp/shfmt /usr/local/bin/shfmt
          rm -f /tmp/shfmt

      - name: Run quality gates
        run: make check
